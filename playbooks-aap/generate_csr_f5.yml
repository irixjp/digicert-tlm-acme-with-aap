---
# Required variables (from extra_vars):
#   route53_domain - e.g. demo.emacs-lisp.net

- name: Generate CSR for F5 BIG-IP
  hosts: all
  become: true
  gather_facts: false
  vars:
    _fqdn: "f5.{{ route53_domain }}"
    _key_dir: /opt/f5-cert

  tasks:
    - name: Create key directory
      ansible.builtin.file:
        path: "{{ _key_dir }}"
        state: directory
        mode: "0700"

    - name: Generate private key
      community.crypto.openssl_privatekey:
        path: "{{ _key_dir }}/{{ _fqdn }}.key"
        type: RSA
        size: 4096
        mode: "0600"

    - name: Generate CSR
      community.crypto.openssl_csr:
        path: "/tmp/{{ _fqdn }}.csr"
        privatekey_path: "{{ _key_dir }}/{{ _fqdn }}.key"
        common_name: "{{ _fqdn }}"
        subject_alt_name: "DNS:{{ _fqdn }}"
        key_usage:
          - digitalSignature
          - keyEncipherment
        extended_key_usage:
          - clientAuth
          - serverAuth

    - name: Read CSR content
      ansible.builtin.slurp:
        src: "/tmp/{{ _fqdn }}.csr"
      register: _csr_content

    - name: Pass CSR data to next job
      ansible.builtin.set_stats:
        data:
          csr_data: "{{ _csr_content.content | b64decode }}"
          cert_common_name: "{{ _fqdn }}"
