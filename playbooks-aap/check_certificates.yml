---
# Required variables (from AAP credentials or extra_vars):
#   route53_domain    - e.g. demo.emacs-lisp.net
#   redmine_url       - e.g. http://10.100.11.x:8888
#   redmine_username  - Redmine API user
#   redmine_password  - Redmine API password

- name: Check certificates
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    _check_sites:
      - "nginx.{{ route53_domain }}"
      - "apache.{{ route53_domain }}"
      - "f5.{{ route53_domain }}"
      - www.redhat.com
      - example.com
      - expired.badssl.com
      - expired-rsa-dv.ssl.com

  tasks:
    - name: Set JST timestamps
      ansible.builtin.set_fact:
        _now_jst: "{{ '%Y-%m-%d %H:%M JST' | strftime(ansible_date_time.epoch | int + 32400) }}"
        _today_jst_epoch: "{{ ansible_date_time.epoch | int + 32400 }}"

    - name: Fetch certificate from each site
      community.crypto.get_certificate:
        host: "{{ item }}"
        port: 443
      register: _certs
      loop: "{{ _check_sites }}"
      ignore_errors: true

    - name: Build report entries
      ansible.builtin.set_fact:
        _reports: >-
          {{ _reports | default([]) + [_entry] }}
      vars:
        _has_cert: "{{ item.not_after is defined }}"
        _na_entry:
          fqdn: "{{ item.item }}"
          not_after_jst: "N/A"
          valid_days: "-1"
        _cert_epoch: >-
          {{ (item.not_after[:14] | to_datetime('%Y%m%d%H%M%S')).strftime('%s') | int
             if _has_cert | bool else 0 }}
        _cert_entry:
          fqdn: "{{ item.item }}"
          not_after_jst: "{{ '%Y-%m-%d' | strftime(_cert_epoch | int + 32400) }}"
          valid_days: >-
            {{ (('%Y%m%d' | strftime(_cert_epoch | int + 32400) | to_datetime('%Y%m%d')) -
                ('%Y%m%d' | strftime(_today_jst_epoch | int) | to_datetime('%Y%m%d'))).days }}
        _entry: "{{ _cert_entry if _has_cert | bool else _na_entry }}"
      loop: "{{ _certs.results }}"

    - name: Build report content
      ansible.builtin.set_fact:
        _report_content: |-
          Last update: {{ _now_jst }}

          | FQDN | Expiration (JST) | Valid Days | Status |
          |------|-----------------|------------|--------|
          {% for r in _reports %}
          {% set d = r.valid_days | int %}
          | [{{ r.fqdn }}](https://{{ r.fqdn }}) | {{ r.not_after_jst }} | {{ d }} | {{ '☠️ Expired' if d <= 0 else '🚨 Critical' if d <= 10 else '⚠️ Warning' if d <= 20 else '🟢 OK' }} |
          {% endfor %}

          **Legend:** 🟢 OK (21+ days) / ⚠️ Warning (11-20 days) / 🚨 Critical (1-10 days) / ☠️ Expired (0 days or less)

    - name: Display report
      ansible.builtin.debug:
        msg: "{{ _report_content }}"

    - name: Update Redmine wiki page
      ansible.builtin.uri:
        url: "{{ redmine_url }}/projects/{{ redmine_project | default('aap-demo') }}/wiki/{{ redmine_wiki_page | default('Certificate_Report') }}.json"
        method: PUT
        body_format: json
        body:
          wiki_page:
            text: "{{ _report_content }}"
        url_username: "{{ redmine_username }}"
        url_password: "{{ redmine_password }}"
        force_basic_auth: true
        status_code: [200, 201, 204]
