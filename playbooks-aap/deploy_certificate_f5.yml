---
# Required variables (from AAP credentials or extra_vars):
#   fullchain_data     - fullchain PEM certificate (from Job 2 set_stats)
#   cert_common_name   - FQDN e.g. f5.demo.emacs-lisp.net (from Job 1 set_stats)
#   f5_admin_password  - F5 admin password
#   route53_domain     - e.g. demo.emacs-lisp.net

- name: Deploy certificate to F5 BIG-IP
  hosts: f5
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _key_dir: /opt/f5-cert
    f5_provider:
      server: "{{ ansible_host }}"
      user: "{{ ansible_user }}"
      password: "{{ f5_admin_password }}"
      server_port: 8443
      validate_certs: false

  tasks:
    - name: Fetch private key from nginx-f5
      ansible.builtin.slurp:
        src: "{{ _key_dir }}/{{ cert_common_name }}.key"
      delegate_to: nginx-f5
      become: true
      register: _private_key
      no_log: true

    - name: Switch SSL profile to default cert temporarily
      f5networks.f5_modules.bigip_profile_client_ssl:
        name: demo_clientssl
        cert_key_chain:
          - cert: default
            key: default
        provider: "{{ f5_provider }}"

    - name: Import SSL key to F5
      f5networks.f5_modules.bigip_ssl_key:
        name: "{{ cert_common_name }}"
        content: "{{ _private_key.content | b64decode }}"
        state: present
        provider: "{{ f5_provider }}"
      no_log: true

    - name: Import SSL certificate to F5
      f5networks.f5_modules.bigip_ssl_certificate:
        name: "{{ cert_common_name }}"
        content: "{{ fullchain_data }}"
        state: present
        provider: "{{ f5_provider }}"

    - name: Restore SSL profile to updated cert
      f5networks.f5_modules.bigip_profile_client_ssl:
        name: demo_clientssl
        cert_key_chain:
          - cert: "{{ cert_common_name }}"
            key: "{{ cert_common_name }}"
        provider: "{{ f5_provider }}"
